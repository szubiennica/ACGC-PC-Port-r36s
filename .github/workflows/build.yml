name: build-armhf
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bullseye
    steps:
      - name: Point apt at the Debian archive
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y cmake make pkg-config gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libsdl2-dev:armhf libgles-dev:armhf libegl-dev:armhf
      - uses: actions/checkout@v4
      - name: Build
        run: ./build_make.sh --armhf --gles
      - uses: actions/upload-artifact@v4
        with:
          name: AnimalCrossing-armhf
          path: pc/build32/bin/
